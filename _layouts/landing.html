<!DOCTYPE html>
<html lang="{{ page.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": {{ page.softwareName | jsonify }},
    "description": {{ page.description | jsonify }},
    "operatingSystem": "Windows 10/11 64-bit",
    "applicationCategory": "UtilitiesApplication",
    "url": {{ page.repoUrl | jsonify }},
    "downloadUrl": {{ page.downloadUrl | jsonify }},
    "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "CNY" }
  }
  </script>
  {% if page.faq %}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {% for item in page.faq %}
      {
        "@type": "Question",
        "name": {{ item.q | jsonify }},
        "acceptedAnswer": { "@type": "Answer", "text": {{ item.a | jsonify }} }
      }{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ]
  }
  </script>
  {% endif %}
  <style>
    :root { --accent: #238636; --accent-hover: #2da44e; --border: #d0d7de; --bg-soft: #f6f8fa; }
    * { box-sizing: border-box; }
    body { margin: 0; color: #1f2328; background: #fff;
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
           line-height: 1.65; }
    .hero { text-align: center; padding: 3.5rem 1.25rem 2.5rem;
            background: linear-gradient(180deg, #f6f8fa 0%, #fff 100%); border-bottom: 1px solid var(--border); }
    .hero h1 { font-size: 2em; line-height: 1.25; margin: 0 0 .5rem; }
    .hero .tagline { max-width: 680px; margin: 0 auto 1.5rem; color: #57606a; font-size: 1.05em; }
    .btn { display: inline-block; margin: .25rem; padding: .7rem 1.6rem; border-radius: 6px;
           font-weight: 600; text-decoration: none; font-size: 1em; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: #fff; color: #24292f; border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--bg-soft); }
    .wrap { max-width: 860px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
    h2 { margin-top: 2.2em; border-bottom: 1px solid #d8dee4; padding-bottom: .3em; }
    h3 { margin-top: 1.6em; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: .93em; display: block; overflow-x: auto; }
    th, td { border: 1px solid #d0d7de; padding: 6px 12px; text-align: left; }
    th { background: #f6f8fa; }
    code { background: #eff1f3; padding: .2em .4em; border-radius: 4px; font-size: .88em; }
    pre { background: #f6f8fa; padding: 1rem; border-radius: 6px; overflow-x: auto; }
    pre code { background: none; padding: 0; }
    a { color: #0969da; }
    ul, ol { padding-left: 1.4em; }
    .steps { counter-reset: step; list-style: none; padding-left: 0; }
    .steps li { counter-increment: step; position: relative; padding-left: 2.6em; margin: 1em 0; }
    .steps li::before { content: counter(step); position: absolute; left: 0; top: .1em;
            width: 1.7em; height: 1.7em; border-radius: 50%; background: var(--accent); color: #fff;
            text-align: center; line-height: 1.7em; font-weight: 600; font-size: .92em; }
    .screenshot { max-width: 100%; border: 1px solid var(--border); border-radius: 8px; margin: 1rem 0;
                  box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .wrap img { max-width: 100%; height: auto; border: 1px solid var(--border); border-radius: 8px; margin: 1rem 0;
                box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .note { background: #fff8c5; border: 1px solid #d4a72c66; border-radius: 6px; padding: .6rem 1rem; margin: 1rem 0; }
    details { border: 1px solid var(--border); border-radius: 6px; padding: .6rem 1rem; margin: .6rem 0; background: #fff; }
    summary { cursor: pointer; font-weight: 600; }
    footer { text-align: center; padding: 1.5rem; color: #57606a; font-size: .9em; border-top: 1px solid var(--border); }
  </style>
</head>
<body>
  <header class="hero">
    <h1>{{ page.title }}</h1>
    <p class="tagline">{{ page.tagline }}</p>
    <p>
      <a class="btn btn-primary" href="{{ page.downloadUrl }}">下载 {{ page.shortName }}</a>
      <a class="btn btn-secondary" href="{{ page.repoUrl }}">查看源码</a>
    </p>
  </header>
  <div class="wrap">
    {{ content }}
    {% if page.faq %}
    <section id="faq">
      <h2>常见问题</h2>
      {% for item in page.faq %}
      <details>
        <summary>{{ item.q }}</summary>
        <div>{{ item.a | markdownify }}</div>
      </details>
      {% endfor %}
    </section>
    {% endif %}
  </div>
  <footer>
    {{ page.softwareName }} · Windows 10/11 · <a href="{{ page.repoUrl }}">GitHub</a>
  </footer>
</body>
</html>
